println "[Echelon] forge/build.gradle loaded"

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

buildscript {
    repositories {
        maven { url = "https://maven.minecraftforge.net/" }
        maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:6.0.46"
        classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"
    }
}

apply plugin: "java"
apply plugin: "net.minecraftforge.gradle"
apply plugin: "org.spongepowered.mixin"

group = project.maven_group
version = project.mod_version

base {
    archivesName.set(project.archives_base_name)
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url = "https://maven.minecraftforge.net/" }
    maven {
        url "https://cursemaven.com/"
        content { includeGroup "curse.maven" }
    }
    maven { url = "https://maven.shadowsoffire.dev/releases" }
}


dependencies {
    minecraft "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"
    implementation fg.deobf("curse.maven:placebo-283644:6274231")
    implementation fg.deobf("curse.maven:apothic-attributes-898963:5634071")
    implementation fg.deobf("curse.maven:lionfishapi-1001614:5922047")
    implementation fg.deobf("curse.maven:clothapi-348521:5729105")
    implementation fg.deobf("curse.maven:bettercombat-639842:5625757")
    implementation fg.deobf("curse.maven:citadel-331936:6702068")
    compileOnly fg.deobf("curse.maven:tooltipoverhaul-1327508:7096296")
    compileOnly fg.deobf("curse.maven:obscureAPI-638417:7171906")
    compileOnly fg.deobf("curse.maven:jei-238222:7391695")
    compileOnly fg.deobf("curse.maven:emi-580555:6420945")
    compileOnly fg.deobf("curse.maven:ars-nouveau-401955:6688854")
    compileOnly "org.joml:joml:1.10.5"
    compileOnly "com.mojang:datafixerupper:6.0.8"
    compileOnly "com.mojang:brigadier:1.2.9"
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
}

tasks.named("jar", Jar).configure {
    // Tell Forges Mixin bootstrap which configs to load
    manifest {
        attributes([
            "MixinConfigs": "tiered.forge.mixins.json"
        ])
    }
}

mixin {
    add sourceSets.main, "tiered.refmap.json"
    config "tiered.forge.mixins.json"
}

minecraft {
    mappings channel: "official", version: rootProject.minecraft_version

    runs {
        client {
            // FORCE mixin configs in dev runs
            args '--mixin.config', 'tiered.forge.mixins.json'

            // Optional but very useful while validating
            property 'mixin.debug.verbose', 'true'
            property 'mixin.debug.export', 'true'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
            // Dev-only: avoid C2 JIT instability seen in hs_err logs
            jvmArgs '-XX:TieredStopAtLevel=1'
            workingDirectory project.file("run")

            mods {
                tiered {
                    source sourceSets.main
                }
            }
        }

        server {
            args '--mixin.config', 'tiered.forge.mixins.json'

            property 'mixin.debug.verbose', 'true'
            property 'mixin.debug.export', 'true'

            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
            workingDirectory project.file("run-server")

            mods {
                tiered {
                    source sourceSets.main
                }
            }
        }
    }
}
